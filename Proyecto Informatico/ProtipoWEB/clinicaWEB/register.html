<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Clínica | Registrarse</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&display=swap">
<link rel="stylesheet" href="register.css">
</head>
<body>
<div class="login">
<form class="login-box registro" id="formRegister" novalidate>
<div class="logo"><i>+</i> Clínica Salud</div>
<h1>Creá tu cuenta</h1>
<p class="muted">Completá tus datos para registrarte.</p>
<div class="grilla">
<div>
<label for="nombre">Nombre</label>
<input id="nombre" name="nombre" type="text" autocomplete="given-name" maxlength="100" required>
</div>
<div>
<label for="apellido">Apellido</label>
<input id="apellido" name="apellido" type="text" autocomplete="family-name" maxlength="100" required>
</div>
<div>
<label for="dni">DNI</label>
<input id="dni" name="dni" type="text" inputmode="numeric" maxlength="20" required>
</div>
<div>
<label for="fechaNacimiento">Fecha de nacimiento</label>
<input id="fechaNacimiento" name="fechaNacimiento" type="date" autocomplete="bday">
</div>
<div>
<label for="telefono">Teléfono</label>
<input id="telefono" name="telefono" type="tel" autocomplete="tel" maxlength="30">
</div>
<div>
<label for="obraSocialId">Obra social (ID, opcional)</label>
<input id="obraSocialId" name="obraSocialId" type="number" min="1" inputmode="numeric">
</div>
<div class="ancho">
<label for="email">Email</label>
<input id="email" name="email" type="email" autocomplete="email" maxlength="100" required>
</div>
<div>
<label for="password">Contraseña</label>
<input id="password" name="password" type="password" autocomplete="new-password" maxlength="40" required>
</div>
<div>
<label for="password2">Repetir contraseña</label>
<input id="password2" name="password2" type="password" autocomplete="new-password" maxlength="40" required>
</div>
</div>
<button class="btn" type="submit">Registrarme</button>
<p class="cambio muted">¿Ya tenés cuenta? <a href="login.html">Ingresá</a></p>
</form>
</div>
<script src="register.js"></script>
</body>
</html>
