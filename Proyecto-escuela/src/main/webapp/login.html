<!DOCTYPE html>
<html lang="es">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width,initial-scale=1">
        <title>Clínica | Ingresar
        </title>
        <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&display=swap">
        <link rel="stylesheet" href="login.css">
    </head>
    <body>
        <div class="login">
            <form class="login-box" id="formLogin" novalidate>
                <div class="logo"><i>+</i> Clínica Salud</div>
                <h1>Ingresá a tu cuenta</h1>
                <p class="muted">Usá tu email y contraseña.</p>
                <label for="email">Email</label>
                <input id="email" name="email" type="email" autocomplete="email" required>
                <label for="password">Contraseña</label>
                <input id="password" name="password" type="password" autocomplete="current-password" maxlength="40" required>
                <button class="btn" type="submit">Ingresar</button>
                <p class="cambio muted">¿No tenés cuenta? <a href="register.html">Registrate</a></p>
            </form>
        </div>
        <script src="login.js">

        </script>
        </body>
        </html>
